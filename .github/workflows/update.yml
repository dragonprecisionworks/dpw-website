name: Nightly Etsy update
on:
  schedule:
    - cron: "1 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update.mjs
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
      - name: Save changes
        run: |
          git config user.name "etsy-sync"
          git config user.email "etsy-sync@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Nightly Etsy update" && git push)
